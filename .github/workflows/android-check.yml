name: Android checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  debug-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify web reference and bridge
        run: node scripts/verify-web.mjs
      - name: Build and lint
        run: bash gradlew assembleDebug lintDebug
      - name: Check 64-bit native alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/verify-native-alignment.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: app/build/reports/
# Deliberately no Play upload, publishing, or rollout automation.
