plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
}

def ulaRelease = new groovy.json.JsonSlurper().parse(file('../reference/web-release.json'))

android {
    namespace 'com.sunswift.ula'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.sunswift.ula'
        minSdk 24
        targetSdk 36
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode ulaRelease.versionCode
        versionName "${ulaRelease.androidVersion}-web-v${ulaRelease.webVersion}"
        buildConfigField 'String', 'ULA_ANDROID_VERSION', "\"${ulaRelease.androidVersion}\""
        buildConfigField 'String', 'ULA_WEB_VERSION', "\"${ulaRelease.webVersion}\""
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
            if (project.hasProperty('ulaNativeBuildDir')) {
                buildStagingDirectory file(project.property('ulaNativeBuildDir'))
            }
        }
    }

    packaging {
        jniLibs {
            // The app-built replacement takes precedence over the upstream
            // prebuilt. Strict ELF checks in CI verify its 16 KB RELRO layout.
            pickFirsts += ['**/libandroidx.graphics.path.so']
        }
    }

    signingConfigs {
        debug {
            // Keep this workstation's Firebase test identity. CI uses its own standard debug key.
            def workstationKey = file('../.android-home/debug.keystore')
            if (workstationKey.exists()) {
                storeFile workstationKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        if (System.getenv('ULA_UPLOAD_STORE_FILE')) {
            upload {
                storeFile file(System.getenv('ULA_UPLOAD_STORE_FILE'))
                storePassword System.getenv('ULA_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('ULA_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('ULA_UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.findByName('upload')) signingConfig signingConfigs.upload
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.00')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.webkit:webkit:1.12.1'
    // Includes Android 15 background/blocked-network constraint fixes.
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    // Updated native path library and Play Services models avoid older bundled
    // scanner binaries that cannot run on Android devices with 16 KB pages.
    implementation 'androidx.graphics:graphics-path:1.1.0'
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
